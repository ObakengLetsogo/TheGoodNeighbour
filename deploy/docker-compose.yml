# One small server: PostgreSQL + the TGN API + automatic HTTPS (Caddy).
#   cp .env.example .env   (fill it in)   then:   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgn
      POSTGRES_USER: tgn
      POSTGRES_PASSWORD: ${TGN_DB_PASSWORD:?set TGN_DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgn -d tgn"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TGN_DB_URL: jdbc:postgresql://db:5432/tgn
      TGN_DB_USER: tgn
      TGN_DB_PASSWORD: ${TGN_DB_PASSWORD}
      TGN_PII_KEY: ${TGN_PII_KEY:?set TGN_PII_KEY (openssl rand -base64 32)}
      TGN_BOOTSTRAP_ADMIN_EMAIL: ${TGN_BOOTSTRAP_ADMIN_EMAIL:?set the first staff email}
      TGN_BOOTSTRAP_ADMIN_PASSWORD: ${TGN_BOOTSTRAP_ADMIN_PASSWORD:?set the first staff password (12+ characters)}
      TGN_CORS_ALLOWED_ORIGINS: ${TGN_CORS_ALLOWED_ORIGINS:-}
      TGN_SEED_SAMPLE_COVER: ${TGN_SEED_SAMPLE_COVER:-false}
      TGN_SMS_MODE: ${TGN_SMS_MODE:-disabled}
      TGN_STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80", "443:443"]
    environment:
      TGN_DOMAIN: ${TGN_DOMAIN:?set TGN_DOMAIN, e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  uploads:
  dbdata:
  caddydata:
