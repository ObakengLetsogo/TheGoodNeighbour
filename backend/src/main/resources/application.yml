spring:
  application:
    name: tgn-backend
  datasource:
    # Local development uses an in-memory H2 database. Production uses PostgreSQL: set
    # SPRING_PROFILES_ACTIVE=prod and the TGN_DB_* variables (see application-prod.yml).
    url: jdbc:h2:mem:tgn;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

tgn:
  # Comma-separated list of browser origins allowed to call the API (Expo web / admin dashboard).
  cors-allowed-origins: ${TGN_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  # Loads src/main/resources/seed/catalog.json into an empty database. Sample data only.
  seed-sample-catalog: ${TGN_SEED_SAMPLE_CATALOG:true}
