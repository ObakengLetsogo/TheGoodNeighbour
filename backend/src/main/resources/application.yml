spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  application:
    name: tgn-backend
  datasource:
    # Local development uses an in-memory H2 database. Production uses PostgreSQL (see application-prod.yml).
    url: jdbc:h2:mem:tgn;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      # The schema is created and changed ONLY by the migrations in db/migration (Flyway). Hibernate just checks that the
      # entities match it, so an entity change without a migration fails at startup (and in the tests).
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

tgn:
  # Browser origins allowed to call the API (admin dashboard, Expo web).
  cors-allowed-origins: ${TGN_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5173,http://localhost:5174}
  # Monthly price as basis points of the bundle's cost (55 = 0.55%). Used only when seeding the sample rules. PLACEHOLDER.
  seed-base-rate-bps: ${TGN_SEED_BASE_RATE_BPS:55}
  # Loads placeholder cover rules and a sample catalogue into an empty database. Sample numbers only.
  seed-sample-cover: ${TGN_SEED_SAMPLE_COVER:true}
  # Base64 AES-256 key that encrypts ID numbers at rest. REQUIRED in production.
  pii-key: ${TGN_PII_KEY:}
  # Creates the first staff account if none exist. Password must be at least 12 characters.
  bootstrap-admin-email: ${TGN_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${TGN_BOOTSTRAP_ADMIN_PASSWORD:}
  # log = development (one-time codes are written to the server log). disabled = no SMS provider connected.
  sms-mode: ${TGN_SMS_MODE:log}
  # Where uploaded claim documents are stored, encrypted. In production this must be a persistent volume.
  storage-dir: ${TGN_STORAGE_DIR:${java.io.tmpdir}/tgn-uploads}
