spring:
  datasource:
    url: ${TGN_DB_URL:jdbc:postgresql://localhost:5432/tgn}
    username: ${TGN_DB_USER:tgn}
    password: ${TGN_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # A database that already has tables but no migration history must be baselined by hand, never automatically.
    baseline-on-migrate: false
    validate-on-migrate: true

tgn:
  seed-sample-cover: ${TGN_SEED_SAMPLE_COVER:false}
  sms-mode: ${TGN_SMS_MODE:disabled}

server:
  # Behind Caddy: use the real visitor address (for rate limits), not the proxy's.
  forward-headers-strategy: native
